name: Deploy Production
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Deploy dry run'
        required: true
        type: boolean
        default: true
      cleanup:
        description: 'Cleanup stale files on target'
        required: true
        type: boolean
        default: false
env:
  REMOTE_HOST: 128.204.219.67
  REMOTE_PORT: 2222
  USER: qtp_ftp
  TARGET: "./wygodny-dom.pl/"
  ENV: prod
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Setup Node.js environment
      uses: actions/setup-node@v4
      with:
        node-version: 20
    - run: |
        corepack enable &&
        corepack install # use the in-repo yarn version
    - uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: "yarn"
    - run: yarn install --frozen-lockfile --network-timeout 1000000000
    - name: generate_api_env
      run: printf "API_KEY=${{ secrets.API_KEY }}\nS_KEY=${{ secrets.S_KEY }}\nUID=${{vars.UID}}\nALLOWED_DOMAIN=${{vars.PROD_DOMAIN}}" >> public/inc/.env
    - name: generate_app_env
      run: printf "NUXT_PUBLIC_ENVIRONMENT=${{ env.ENV }}\nNUXT_PUBLIC_SENTRYDSN=${{ secrets.SENTRY_DSN }}" >> .env
    - name: build
      run: yarn run generate
    - name: prepare rsync args
      run: |
        ARGS="-avzogO"
        if [ "${{ inputs.cleanup }}" = "true" ]; then
          ARGS="$ARGS --delete"
        fi
        if [ "${{ inputs.dry_run }}" = "true" ]; then
          ARGS="$ARGS --dry-run"
        fi
        echo "RSYNC_ARGS=$ARGS" >> "$GITHUB_ENV"
    - name: rsync production
      uses: up9cloud/action-rsync@master
      env:
        HOST: ${{ env.REMOTE_HOST }}
        PORT: ${{ env.REMOTE_PORT }}
        KEY: ${{ secrets.SFTP_VHOSTING_KEY }}
        USER: ${{ env.USER }}
        VERBOSE: true
        TARGET: "${{ env.TARGET }}"
        ARGS: "${{ env.RSYNC_ARGS }}"
        SOURCE: ./.output/public/