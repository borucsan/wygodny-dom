name: Deploy Production
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Deploy dry run'
        required: true
        type: boolean
        default: true
      cleanup:
        description: 'Cleanup stale files on target'
        required: true
        type: boolean
        default: false
env:
  REMOTE_HOST: 128.204.219.67
  REMOTE_PORT: 2222
  USER: qtp_ftp
  TARGET: "./wygodny-dom.pl/"
  ENV: prod
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Setup Node.js environment
      uses: actions/setup-node@v4
      with:
        node-version: 20
    - run: |
        corepack enable &&
        corepack install # use the in-repo yarn version
    - uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: "yarn"
    - run: yarn install --frozen-lockfile --network-timeout 1000000000
    - name: generate_api_env
      run: printf "API_KEY=${{ secrets.API_KEY }}\nS_KEY=${{ secrets.S_KEY }}\nUID=${{vars.UID}}\nALLOWED_DOMAIN=${{vars.PROD_DOMAIN}}" >> public/inc/.env
    - name: generate_app_env
      run: printf "NUXT_PUBLIC_ENVIRONMENT=${{ env.ENV }}\nNUXT_PUBLIC_SENTRYDSN=${{ secrets.SENTRY_DSN }}" >> .env
    - name: build
      run: yarn run generate
    - name: install lftp
      run: sudo apt-get update && sudo apt-get install -y lftp
    - name: setup sftp key
      run: |
        install -m 700 -d ~/.ssh
        printf '%s\n' "${{ secrets.SFTP_VHOSTING_KEY }}" > ~/.ssh/sftp_vhosting_key
        chmod 600 ~/.ssh/sftp_vhosting_key
    - name: setup ssh agent
      run: |
        eval "$(ssh-agent -s)"
        ssh-add ~/.ssh/sftp_vhosting_key
        echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK" >> "$GITHUB_ENV"
        echo "SSH_AGENT_PID=$SSH_AGENT_PID" >> "$GITHUB_ENV"
    - name: sftp deploy
      run: |
        DELETE_FLAG=""
        DRY_RUN_FLAG=""
        if [ "${{ inputs.cleanup }}" = "true" ]; then
          DELETE_FLAG="--delete"
        fi
        if [ "${{ inputs.dry_run }}" = "true" ]; then
          DRY_RUN_FLAG="--dry-run"
        fi
        lftp -e "
          set sftp:auto-confirm yes;
          set net:max-retries 2;
          set net:timeout 20;
          open -u ${{ env.USER }} sftp://${{ env.REMOTE_HOST }}:${{ env.REMOTE_PORT }};
          mirror --reverse --verbose $DELETE_FLAG $DRY_RUN_FLAG ./.output/public/ ${{ env.TARGET }};
          bye
        "