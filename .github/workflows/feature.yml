name: Build Feature Branch
on:
  push:
    branches:
      - "feature/*"
      - "feat/*"
env:
  REGISTRY: ghcr.io
  ENV: staging
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: |
          corepack enable &&
          corepack install
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "yarn"
      - run: yarn install --frozen-lockfile --network-timeout 1000000000
      - name: generate_api_env
        run: printf "API_KEY=\nS_KEY=${{ secrets.STAGE_S_KEY }}\nUID=${{ vars.STAGE_UID }}\nRET_UID=${{ vars.RET_UID }}\nRET_RKEY=${{ secrets.RET_RKEY }}\nALLOWED_DOMAIN=${{vars.STAGING_DOMAIN}}" >> public/inc/.env
      - name: generate_app_env
        run: printf "NUXT_PUBLIC_ENVIRONMENT=${{ env.ENV }}\nNUXT_PUBLIC_SENTRYDSN=${{ secrets.SENTRY_DSN }}" >> .env
      - name: build
        run: yarn run generate_staging
      - name: Image name (lowercase for GHCR)
        run: echo "IMAGE_NAME=${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV
      - name: Branch slug
        run: echo "BRANCH_SLUG=$(echo '${{ github.ref_name }}' | sed 's/[^a-zA-Z0-9]/-/g' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV
      - name: Login to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build image and push to registry
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.BRANCH_SLUG }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
